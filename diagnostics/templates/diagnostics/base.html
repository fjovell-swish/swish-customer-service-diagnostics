{% extends "admin/base_site.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
  .search input[type=text] { width: 28em; padding: 6px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-weight: 600; font-size: .85em; color: #fff; }
  .badge-ok, .badge-high, .badge-diagnosed { background: #2e7d32; }
  .badge-info, .badge-medium { background: #1565c0; }
  .badge-warning, .badge-low { background: #ef6c00; }
  .badge-problem { background: #c62828; }
  .badge-open { background: #6a1b9a; }
  .badge-closed { background: #757575; }
  .callout { padding: 12px 16px; border-radius: 6px; margin: 0 0 1em; border-left: 6px solid #1565c0; background: var(--darkened-bg); }
  .callout-problem, .callout-high { border-color: #c62828; }
  .callout-warning, .callout-medium { border-color: #ef6c00; }
  .callout-ok, .callout-low { border-color: #2e7d32; }
  .module td { vertical-align: top; }
  .reply { background: var(--darkened-bg); padding: 8px 10px; border-radius: 4px; margin-bottom: 6px; white-space: pre-wrap; }
  .muted { color: var(--body-quiet-color); }
  .facts th { width: 12em; }
  .question { padding: 12px 16px; }
  .question ul { list-style: none; padding-left: 0; }
  .question li { margin: 6px 0; }
  .question p > label:first-child { font-size: 1.15em; font-weight: 600; display: block; margin-bottom: 8px; }
  .question input[type=text] { width: 28em; padding: 6px; }
  .actions-row { display: flex; gap: 8px; align-items: center; margin: 12px 0; flex-wrap: wrap; }
  .columns { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; }
  @media (max-width: 1024px) { .columns { grid-template-columns: 1fr; } }
</style>
{% endblock extrastyle %}

{% block extrabody %}
{{ block.super }}
<script>
  document.addEventListener("click", (event) => {
    const button = event.target.closest(".copy");
    if (!button) return;
    navigator.clipboard.writeText(document.getElementById(button.dataset.target).innerText);
    button.textContent = "Copied";
  });
</script>
{% endblock extrabody %}
