[project]
name = "swish-customer-service-diagnostics"
version = "0.1.0"
description = "Diagnose \"the charger doesn't work\" from the live central system's data"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "Django>=6.1,<6.2",
    "dj-database-url>=3.1",
    "psycopg[binary]>=3.2",
    "gunicorn>=23",
    "whitenoise>=6",
    "sentry-sdk[django]>=2.0",
    "django-stubs-ext>=5.0",
    # The deployments page: GitHub Actions and Kubernetes.
    "httpx>=0.28.1",
    "kubernetes>=37.0.2",
    # Claude's assessment of a case (diagnostics/assistant.py).
    "anthropic>=2.13",
    # admindocs renders the docstrings (reStructuredText) at /admin/doc/.
    "docutils>=0.21",
    # manage.py reads the repo's .env (local runs).
    "python-dotenv>=1.1",
    # Sign-in with Microsoft: reading the ID token (config/microsoft.py).
    "pyjwt>=2.10",
    # The MCP API (mcp_api/), and the ASGI server for the app and /mcp (config/asgi.py).
    "mcp>=2.3",
    "uvicorn-worker>=0.4",
]

[project.optional-dependencies]
# Tests, linters and developer tooling. Never installed in the runtime image.
test = [
    "covdefaults",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-randomly",
    "pytest-xdist",
    "time-machine",
    "respx",
    "django-stubs[compatible-mypy]",
    "pip-tools",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { include = ["config*", "deployments*", "diagnostics*", "mcp_api*", "services*"] }

[tool.isort]
profile = "black"
line_length = 99
force_single_line = true
known_first_party = ["config", "deployments", "diagnostics", "mcp_api", "services"]
skip_glob = ["services/*/models.py"]

[tool.autoflake]
recursive = true

[tool.mypy]
# `mypy` with no arguments checks the whole project in strict mode (the "Type check" workflow).
files = ["config", "deployments", "diagnostics", "mcp_api", "services", "manage.py"]
strict = true
python_version = "3.15"
plugins = ["mypy_django_plugin.main"]
warn_unreachable = true
show_error_codes = true
pretty = false

[[tool.mypy.overrides]]
# The Kubernetes client ships no type hints.
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.local"
strict_settings = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
markers = [
    "postgres: needs Postgres (introspection of its catalogs); skipped on SQLite",
]
# The runtime image collects static files; tests serve them from the apps' own directories.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.coverage.run]
plugins = ["covdefaults"]
source = ["config", "deployments", "diagnostics", "mcp_api", "services", "tests"]
# Everything is measured except the generated api-ocpp models; covdefaults sets fail_under = 100.
omit = ["services/*/models.py"]

[tool.coverage.html]
directory = "artifacts/htmlcov/"
