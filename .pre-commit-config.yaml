---
# Same hooks as central-system-new-world.
# Generated by `manage.py regenerate_models` (inspectdb); formatting them would make every regeneration a diff.
exclude: ^services/(ocpp|gateway|gireve)/models\.py$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
  - repo: https://github.com/PyCQA/autoflake
    rev: v2.3.3
    hooks:
      - id: autoflake
        args: [-r, -i, --remove-all-unused-imports, --remove-duplicate-keys]
  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black
        args: [-l, "99", -t, py314]
  # isort instead of reorder-python-imports: that tool strips the blank line black inserts after a
  # module docstring, so the two can never agree on a module that has one.
  # force_single_line keeps the same one-import-per-line style.
  - repo: https://github.com/PyCQA/isort
    rev: 7.0.0
    hooks:
      - id: isort
  - repo: https://github.com/adamchainz/djade-pre-commit
    rev: "1.9.0"
    hooks:
      - id: djade
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py314-plus]
  - repo: https://github.com/adamchainz/django-upgrade
    rev: "1.30.0"
    hooks:
      - id: django-upgrade
        args: [--target-version, "6.0"]  # newest target django-upgrade 1.30 knows
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x, -P, deploy/scripts]
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions
