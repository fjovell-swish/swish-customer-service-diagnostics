# Local stack.
#   docker compose up --build web     # the production image on :8000, migrated first, on this Postgres
# (Tests don't need it: they run on SQLite locally; CI runs them on Postgres too.)
# Sign in with Microsoft when .env sets MICROSOFT_* (README: Signing in), or with a password:
#   docker compose run --rm web manage createsuperuser
name: swishdiag

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: swish
      POSTGRES_USER: swish
      POSTGRES_PASSWORD: swish
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swish"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The app's own tables (cases, users), on the image, before web starts: what the migrate job does.
  migrate:
    build: &web-build
      context: .
      dockerfile: docker/Dockerfile
    environment: &web-env
      SECRET_KEY: compose-only-not-a-secret
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8000"
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_DATA_GROUPS: ${MICROSOFT_DATA_GROUPS:-}
      MICROSOFT_SUPPORT_GROUPS: ${MICROSOFT_SUPPORT_GROUPS:-}
      DATABASE_URL: postgres://swish:swish@postgres:5432/swish
      # Point at a real api-ocpp (read-only user) to look at real chargers.
      OCPP_DATABASE_URL: ${OCPP_DATABASE_URL:-postgres://swish:swish@postgres:5432/swish}
      OCPP_TENANTS: ${OCPP_TENANTS:-public}
      LOG_FORMAT: plain
      SENTRY_DSN: ""
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: *web-build
    environment: *web-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
