---
name: Pre Commit

# Every hook in .pre-commit-config.yaml on every file, through swish-charge/ci-workflows' lint.yml.
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    uses: swish-charge/ci-workflows/.github/workflows/lint.yml@v1
    with:
      python-version: "3.15"
