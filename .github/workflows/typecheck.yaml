---
name: Type check

# mypy --strict (pyproject.toml), through swish-charge/ci-workflows' python-tests.yml.
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

jobs:
  mypy:
    uses: swish-charge/ci-workflows/.github/workflows/python-tests.yml@v1
    with:
      python-version: "3.15"
      sync-command: uv pip install --require-hashes -r test-requirements.txt
      test-env: DJANGO_SETTINGS_MODULE=config.settings.local
      test-command: mypy --show-traceback
