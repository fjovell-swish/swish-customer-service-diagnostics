---
name: Type check

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:  # every PR, stacked ones included (their base is another PR's branch)

jobs:
  mypy:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: "pip"

      - name: Install dependencies
        run: |
          set -o pipefail
          pip install -r test-requirements.txt 2>&1 | tee mypy.log

      - name: mypy --strict
        run: |
          set -o pipefail
          mypy --show-traceback 2>&1 | tee mypy.log

      - name: Surface errors as annotations
        if: failure()
        shell: python
        run: |
          import re
          lines = open("mypy.log", errors="replace").read().splitlines()
          for l in lines:
              m = re.match(r"^(?P<file>[^:]+):(?P<line>\d+):(?:(?P<col>\d+):)? error: (?P<msg>.*)$", l)
              if m:
                  print(f"::error file={m['file']},line={m['line']},title=mypy::{m['msg'][:500]}")
          tail = "%0A".join(l[:240] for l in lines[-20:])
          print(f"::error title=mypy summary::{tail[:3800]}")
