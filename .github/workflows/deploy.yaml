---
name: Deploy

# Release pipeline. Pushing a tag `vX.Y.Z` builds the image once, deploys it to staging,
# then promotes the very same image (by digest, no rebuild) to production. The `production`
# GitHub environment should require reviewers, so the production job waits for an approval.
#
#   git tag v1.4.0 && git push origin v1.4.0
#
# Manual runs redeploy a tag that already exists in the staging registry to one environment
# (a rollback is `environment: production, tag: v1.3.2`).
#
# Secrets, per GitHub environment (`staging`, `production`), using OIDC federated credentials:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# and the app's own:
#   OCPP_DATABASE_URL   that environment's api-ocpp Postgres, as a READ-ONLY user
#   SENTRY_DSN          optional
# The production identity also needs AcrPull on the staging registry (for the import), and the
# Terraform backend in deploy/terraform/providers.tf must be configured.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      tag:
        description: "Existing image tag to deploy (e.g. v1.4.0)"
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"

jobs:
  build:
    name: Build and push the image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=deploy/terraform init -input=false

      - name: Build and push to the staging registry
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -o pipefail
          deploy/scripts/build-push.sh staging "${{ steps.tag.outputs.tag }}" 2>&1 | tee build.log

      - name: Surface failures as annotations
        if: failure()
        shell: python
        run: |
          lines = [l.replace("\r", "")[:240] for l in open("build.log", errors="replace").read().splitlines()]
          print("::error title=build-push::" + "%0A".join(lines[-40:])[:3800])

  staging:
    name: Deploy to staging
    needs: [build]
    if: >-
      !cancelled() && needs.build.result != 'failure'
      && (github.event_name == 'push' || inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.urls.outputs.web }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=deploy/terraform init -input=false

      - name: Deploy
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_ocpp_database_url: ${{ secrets.OCPP_DATABASE_URL }}
          TF_VAR_gateway_database_url: ${{ secrets.GATEWAY_DATABASE_URL }}
          TF_VAR_gireve_database_url: ${{ secrets.GIREVE_DATABASE_URL }}
          TF_VAR_sentry_dsn: ${{ secrets.SENTRY_DSN }}
          # The deployments page. Secrets can't start with GITHUB_; an unset kubeconfig is dropped.
          TF_VAR_github_token: ${{ secrets.DEPLOYMENTS_GITHUB_TOKEN }}
          # Claude's assessment and the Jira escalation of a case; unset: their buttons are hidden.
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_jira_email: ${{ secrets.JIRA_EMAIL }}
          TF_VAR_jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
          TF_VAR_kubeconfigs: >-
            {"staging": ${{ toJSON(secrets.KUBECONFIG_STAGING) }},
            "production": ${{ toJSON(secrets.KUBECONFIG_PRODUCTION) }},
            "csms-production": ${{ toJSON(secrets.KUBECONFIG_CSMS_PRODUCTION) }}}
        run: |
          set -o pipefail
          deploy/scripts/deploy.sh staging --tag "${{ needs.build.outputs.tag || inputs.tag }}" 2>&1 | tee deploy.log

      - id: urls
        run: echo "web=$(terraform -chdir=deploy/terraform output -raw web_url)" >> "$GITHUB_OUTPUT"

      - name: Surface failures as annotations
        if: failure()
        shell: python
        run: |
          lines = [l.replace("\r", "")[:240] for l in open("deploy.log", errors="replace").read().splitlines()]
          print("::error title=deploy staging::" + "%0A".join(lines[-40:])[:3800])

  production:
    name: Deploy to production
    needs: [build, staging]
    if: >-
      !cancelled() && needs.build.result != 'failure' && needs.staging.result != 'failure'
      && (github.event_name == 'push' || inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.urls.outputs.web }}
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform -chdir=deploy/terraform init -input=false

      - name: Promote the staging image and deploy
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_ocpp_database_url: ${{ secrets.OCPP_DATABASE_URL }}
          TF_VAR_gateway_database_url: ${{ secrets.GATEWAY_DATABASE_URL }}
          TF_VAR_gireve_database_url: ${{ secrets.GIREVE_DATABASE_URL }}
          TF_VAR_sentry_dsn: ${{ secrets.SENTRY_DSN }}
          # The deployments page. Secrets can't start with GITHUB_; an unset kubeconfig is dropped.
          TF_VAR_github_token: ${{ secrets.DEPLOYMENTS_GITHUB_TOKEN }}
          # Claude's assessment and the Jira escalation of a case; unset: their buttons are hidden.
          TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          TF_VAR_jira_email: ${{ secrets.JIRA_EMAIL }}
          TF_VAR_jira_api_token: ${{ secrets.JIRA_API_TOKEN }}
          TF_VAR_kubeconfigs: >-
            {"staging": ${{ toJSON(secrets.KUBECONFIG_STAGING) }},
            "production": ${{ toJSON(secrets.KUBECONFIG_PRODUCTION) }},
            "csms-production": ${{ toJSON(secrets.KUBECONFIG_CSMS_PRODUCTION) }}}
          TAG: ${{ needs.build.outputs.tag || inputs.tag }}
        run: |
          set -o pipefail
          { deploy/scripts/promote.sh staging production "$TAG" && deploy/scripts/deploy.sh production --tag "$TAG"; } 2>&1 | tee deploy.log

      - id: urls
        run: echo "web=$(terraform -chdir=deploy/terraform output -raw web_url)" >> "$GITHUB_OUTPUT"

      - name: Surface failures as annotations
        if: failure()
        shell: python
        run: |
          lines = [l.replace("\r", "")[:240] for l in open("deploy.log", errors="replace").read().splitlines()]
          print("::error title=deploy production::" + "%0A".join(lines[-40:])[:3800])
