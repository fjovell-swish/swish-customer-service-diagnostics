---
name: Run tests

# The steps live in swish-charge/ci-workflows (python-tests.yml); this file says when and with what.
on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:

permissions:
  contents: read

jobs:
  tests-sqlite:
    # What a developer runs locally: the default (local) settings on SQLite, no services, in
    # fixed and in random order. Postgres-only tests skip here.
    name: tests (SQLite)
    uses: swish-charge/ci-workflows/.github/workflows/python-tests.yml@v1
    with:
      python-version: "3.15"
      sync-command: uv pip install --require-hashes -r test-requirements.txt
      test-command: |
        python -m pytest -n 4 -p no:randomly -ra
        python -m pytest -n 4 -ra

  tests-postgres:
    # Postgres (config.settings.ci): every test, migrations committed, and 100% coverage
    # (covdefaults), which only this job enforces.
    name: tests (Postgres, 100% coverage)
    uses: swish-charge/ci-workflows/.github/workflows/python-tests.yml@v1
    with:
      python-version: "3.15"
      sync-command: uv pip install --require-hashes -r test-requirements.txt
      postgres-image: postgres:16
      postgres-user: swish
      postgres-password: swish
      postgres-db: swish
      test-env: DJANGO_SETTINGS_MODULE=config.settings.ci
      test-command: |
        python manage.py makemigrations --check --dry-run
        python -m pytest -n 4 --cov --cov-report term-missing -ra
