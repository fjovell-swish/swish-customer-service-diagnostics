---
name: Terraform

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    paths:
      - deploy/terraform/**
  pull_request:
    paths:
      - deploy/terraform/**

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform -chdir=deploy/terraform fmt -check -diff

      - name: terraform validate
        run: |
          terraform -chdir=deploy/terraform init -input=false -backend=false
          terraform -chdir=deploy/terraform validate
